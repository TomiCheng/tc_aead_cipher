name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            x86: true
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            x86: false
          - name: macOS ARM64
            os: macos-14
            host: aarch64-apple-darwin
            x86: false
          - name: Windows x64
            os: windows-latest
            host: x86_64-pc-windows-msvc
            x86: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install native toolchain
        run: |
          rustup toolchain install stable-${{ matrix.host }} --profile minimal
          rustup default stable-${{ matrix.host }}
          rustc -vV
          rustc -vV | grep -Fx 'host: ${{ matrix.host }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      # SSE2 hosts otherwise never run the portable SPARKLE permutation.
      - name: Test without SSE2 detection
        if: matrix.x86
        run: cargo test --locked -p tc_sparkle_aead --features tc_runtime/disable-x86-sse2

  x86:
    name: Native execution / Linux i686
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit compiler and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --target i686-unknown-linux-gnu
      - run: cargo test --locked --target i686-unknown-linux-gnu --all-features

  msrv:
    name: MSRV / Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
      # Every dependency of the default builds and the alloc features is a tc_*
      # crate, so Rust 1.85 covers them. tc_chacha_aead's rustcrypto feature
      # follows RustCrypto's minimum Rust version instead, 1.85 for the locked
      # releases; if a release raises it, check that feature on stable only.
      # Dev-dependencies are exempt, so tests run on stable only.
      - run: cargo +1.85.0 check --locked
      - run: cargo +1.85.0 check --locked --all-features

  quality:
    name: Format, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-only
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps
      - run: cargo doc --locked --no-deps --all-features
      # Packaged together so the algorithm crates are verified against this
      # tc_aead_cipher, not the release on crates.io.
      - run: cargo package --locked -p tc_aead_cipher -p tc_ascon_aead -p tc_chacha_aead -p tc_grain128_aead -p tc_sparkle_aead
        env:
          # Keep unpacked package manifests outside rust-cache's build tree.
          CARGO_TARGET_DIR: ${{ runner.temp }}/package

  portable:
    name: Cross-architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add wasm32-unknown-unknown aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features
      - run: cargo check --locked --target aarch64-unknown-none
      - run: cargo check --locked --target aarch64-unknown-none --all-features
      - name: Check dependency sets
        run: |
          check() {
            # Sort the expected names the way the actual list is sorted.
            expected="$(printf '%s\n' $1 | sort | paste -sd' ')"; shift
            actual="$(cargo tree --locked --edges normal --prefix none "$@" | cut -d' ' -f1 | sort -u | paste -sd' ')"
            if [ "$actual" != "$expected" ]; then
              echo "cargo tree $*: expected '$expected', got '$actual'" >&2
              exit 1
            fi
          }
          base='tc_aead_cipher tc_block_cipher tc_constant_time'
          chacha='tc_chacha tc_chacha_aead tc_macs tc_poly1305 tc_stream_cipher tc_zeroize'
          # RustCrypto's chacha20 with the cipher traits it builds on.
          rustcrypto='block-buffer cfg-if chacha20 cipher crypto-common hybrid-array inout typenum zeroize'
          for target in aarch64-unknown-none wasm32-unknown-unknown x86_64-unknown-linux-gnu i686-unknown-linux-gnu; do
            check "$base tc_zeroize" -p tc_aead_cipher --target "$target"
            check "$base tc_zeroize" -p tc_aead_cipher --target "$target" --features alloc
            check "$base tc_ascon_aead tc_zeroize" -p tc_ascon_aead --target "$target"
            check "$base $chacha" -p tc_chacha_aead --target "$target"
            check "$base tc_grain128_aead tc_zeroize" -p tc_grain128_aead --target "$target"
            check "$base tc_grain128_aead tc_zeroize" -p tc_grain128_aead --target "$target" --features alloc
          done
          # tc_runtime backs SPARKLE's SSE2 detection on x86 targets only, as
          # cpufeatures backs chacha20's SIMD detection.
          for target in aarch64-unknown-none wasm32-unknown-unknown; do
            check "$base tc_sparkle_aead tc_zeroize" -p tc_sparkle_aead --target "$target"
            check "$base $chacha $rustcrypto" -p tc_chacha_aead --target "$target" --features rustcrypto
          done
          for target in x86_64-unknown-linux-gnu i686-unknown-linux-gnu; do
            check "$base tc_runtime tc_sparkle_aead tc_zeroize" -p tc_sparkle_aead --target "$target"
            check "$base $chacha $rustcrypto cpufeatures" -p tc_chacha_aead --target "$target" --features rustcrypto
          done
