[package]
name = "tc_grain128_aead"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Grain-128AEAD authenticated encryption on the tc_aead_cipher contracts."
readme = "README.md"
documentation = "https://docs.rs/tc_grain128_aead"
keywords = ["grain", "aead", "lightweight", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]

[dependencies]
tc_aead_cipher = { version = "0.1.0", path = "../tc_aead_cipher" }
tc_block_cipher = "0.1.0"
tc_constant_time = "0.1.0"
tc_zeroize = "0.1.0"
