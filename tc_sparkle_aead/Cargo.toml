[package]
name = "tc_sparkle_aead"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SCHWAEMM authenticated encryption on the SPARKLE permutation, on the tc_aead_cipher contracts."
readme = "README.md"
documentation = "https://docs.rs/tc_sparkle_aead"
keywords = ["sparkle", "schwaemm", "aead", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
tc_aead_cipher = { version = "0.1.0", path = "../tc_aead_cipher" }
tc_block_cipher = "0.1.0"
tc_constant_time = "0.1.0"
tc_zeroize = "0.1.0"

# The SSE2 permutation is the only hardware backend, so other targets do not
# need run-time detection.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"
